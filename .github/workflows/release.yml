name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dry run: builds the zip and uploads it as a workflow artifact only (no CurseForge, no GitHub release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The packager needs the .toc at the checkout root and only packages files git tracks.
      # Copy the addon files to the root and commit them in this CI checkout only (never pushed).
      # On a tag push, move the release tag onto that commit so the packager still sees a tagged release.
      - name: Stage addon files at the checkout root
        run: |
          cp addon/QuestieForeverFixes/* .
          git -c user.name=ci -c user.email=ci@localhost add QuestieForeverFixes.toc Core.lua Data.lua icon.png
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI: stage addon files at root"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then git tag -f "$GITHUB_REF_NAME"; fi

      # Build without uploading anything, then check the zip before any upload happens.
      - name: Build package (no upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify package contents
        run: |
          zip=$(ls .release/*.zip | head -n1)
          echo "Package: $zip"
          unzip -l "$zip"
          for f in QuestieForeverFixes.toc Core.lua Data.lua icon.png; do
            unzip -l "$zip" | grep -q "QuestieForeverFixes/$f" || { echo "::error::$f missing from $zip"; exit 1; }
          done
          size=$(stat -c%s "$zip")
          [ "$size" -gt 10000 ] || { echo "::error::$zip is only $size bytes"; exit 1; }

      - name: Keep dry-run package as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip

      - name: Package and upload to CurseForge + GitHub
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        env:
          # Newer packager docs name CF_API_TOKEN, older versions CF_API_KEY; provide both.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
